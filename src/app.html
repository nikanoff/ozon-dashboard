<!doctype html>
<html lang="ru">

<head>
	<meta charset="utf-8" />
	<link rel="icon" href="/favicon.ico" />
	<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<title>Ozon</title>

	<!-- PWA -->
	<link rel="manifest" href="/manifest.webmanifest" />
	<meta name="theme-color" content="#000000" />
	<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
	<meta name="mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
	<meta name="apple-mobile-web-app-title" content="Ozon" />
	<meta name="description"
		content="Ультра-минималистичный дашборд для продавцов Ozon. Аналитика продаж, заказы и управление остатками в реальном времени." />

	<!-- Open Graph / Facebook -->
	<meta property="og:type" content="website" />
	<meta property="og:title" content="Ozon Seller Dashboard" />
	<meta property="og:description" content="Аналитика продаж и управление остатками для продавцов Ozon" />
	<meta property="og:site_name" content="Ozon Dashboard" />

	<!-- Twitter Card -->
	<meta name="twitter:card" content="summary" />
	<meta name="twitter:title" content="Ozon Seller Dashboard" />
	<meta name="twitter:description" content="Аналитика продаж и управление остатками для продавцов Ozon" />

	<!-- Preconnect to font domains -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover" class="dark">
	<div style="display: contents">%sveltekit.body%</div>
</body>

</html>
