<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#000000" />
		<title>Нет подключения · Ozon Dashboard</title>
		<link rel="icon" href="/favicon.ico" />
		<style>
			:root {
				color-scheme: dark;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 24px;
				background: #000;
				color: #a1a1aa;
				font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
				text-align: center;
				-webkit-font-smoothing: antialiased;
			}
			.card {
				max-width: 420px;
				padding: 40px 28px;
				border: 1px solid #27272a;
				border-radius: 20px;
				background: rgba(20, 20, 20, 0.4);
			}
			.icon {
				display: block;
				margin: 0 auto 20px;
			}
			h1 {
				margin: 0 0 8px;
				font-size: 1.15rem;
				font-weight: 700;
				color: #fff;
				letter-spacing: 0.02em;
			}
			p {
				margin: 0 0 24px;
				font-size: 0.9rem;
				line-height: 1.5;
			}
			button {
				padding: 10px 22px;
				border: none;
				border-radius: 10px;
				background: #eab308;
				color: #000;
				font-size: 0.8rem;
				font-weight: 700;
				text-transform: uppercase;
				letter-spacing: 0.1em;
				cursor: pointer;
			}
			button:hover {
				filter: brightness(1.08);
			}
		</style>
	</head>
	<body>
		<div class="card">
			<svg
				class="icon"
				viewBox="0 0 48 48"
				width="48"
				height="48"
				fill="none"
				stroke="#eab308"
				stroke-width="2"
				aria-hidden="true"
			>
				<path d="M24 6 44 24 24 42 4 24Z" />
				<path d="M24 18 34 24 24 30 14 24Z" />
			</svg>
			<h1>Нет подключения</h1>
			<p>
				Не удалось загрузить дашборд. Проверьте интернет-соединение и
				попробуйте снова.
			</p>
			<button type="button" onclick="location.reload()">Обновить</button>
		</div>
	</body>
</html>
